name: Android CI

# Build and test gate for main. This workflow is intentionally minimal and secret-free: it runs the
# JVM unit tests and assembles the debug APK. The full verification gate (release APKs/AAB, signing,
# 16 KB alignment, lint, resource parity, evidence JSON) is scripts/verify.ps1 and runs on a Windows
# machine with PowerShell 7; see CONTRIBUTING.md.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-build:
    name: Unit tests and debug build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      # The runner image ships the Android SDK and accepts its licences. The build expects
      # compileSdk 36 and build-tools 36.0.0; if a component is missing, the Android Gradle Plugin
      # downloads it during the build (the SDK is rooted at ANDROID_HOME, which the image sets).
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Run JVM unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

      - name: Assemble debug APK
        run: ./gradlew :app:assembleDebug --no-daemon --console=plain

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            app/build/reports/tests/**
            app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 7
